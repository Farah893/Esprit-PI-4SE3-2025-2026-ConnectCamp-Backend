# =============================================================================
# APPLICATION CONFIGURATION
# =============================================================================
spring.application.name=ProjetIntegre
server.port=8089

# =============================================================================
# DATABASE - MySQL Configuration
# =============================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/projet_integre?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerAdapter=TRACE

# =============================================================================
# JPA / Hibernate Configuration
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# =============================================================================
# JWT Configuration
# =============================================================================
jwt.secret=ecommerce-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm-security
jwt.expiration=86400000

# =============================================================================
# LOGGING Configuration
# =============================================================================
logging.level.root=INFO
logging.level.tn.esprit.projetintegre=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{36} - %msg%n
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# =============================================================================
# SPRINGDOC / SWAGGER
# =============================================================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.packages-to-scan=tn.esprit.projetintegre.controllers
springdoc.paths-to-match=/api/**,/auth/**

# =============================================================================
# SERVER ERROR
# =============================================================================
server.error.include-message=always
server.error.include-binding-errors=always

# =============================================================================
# AI & ML Configuration
# =============================================================================
groq.api.key=YOUR_GROQ_API_KEY_HERE
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.1-8b-instant

ml.api.base-url=http://localhost:8000

# =============================================================================
# INVOICE CONFIGURATION
# =============================================================================
invoice.company-name=ConnectCamp SARL
invoice.company-address=123 Avenue du Commerce
invoice.company-city=Paris
invoice.company-postal-code=75001
invoice.company-country=France
invoice.company-email=contact@connectcamp.fr
invoice.company-phone=+33 1 23 45 67 89
invoice.company-website=https://www.connectcamp.fr
invoice.siret=123 456 789 00012
invoice.tva-number=FR 12 345 678 901
invoice.logo-url=/uploads/logo.png

invoice.invoice-prefix=FAC
invoice.invoice-validity-days=30
invoice.currency=EUR
invoice.default-tax-rate=20.0

invoice.legal-notice=Delai de retractation: 14 jours. Garantie legale de conformite: 2 ans.
invoice.late-payment-penalty=Penalites de retard: 3 fois le taux d'interet legal.
invoice.collection-fee=Indemnite forfaitaire de recouvrement: 40 EUR.

# =============================================================================
# REDIS
# =============================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.devtools.restart.enabled=false

# =============================================================================
# JACKSON
# =============================================================================
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSZ
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.mapper.accept-case-insensitive-enums=true
spring.mvc.format.date=yyyy-MM-dd

# =============================================================================
# FILE UPLOAD
# =============================================================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=75MB
spring.servlet.multipart.enabled=true
app.upload.dir=uploads

# =============================================================================
# CORS
# =============================================================================
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# =============================================================================
# AUTH
# =============================================================================
app.auth.reset-code-expiration-minutes=10

# =============================================================================
# SMTP
# =============================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# =============================================================================
# ACTUATOR
# =============================================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

# =============================================================================
# TRACKING / 17TRACK (? FIX IMPORTANT)
# =============================================================================
tracking.api.url=https://api.17track.net
tracking.api.key=YOUR_17TRACK_API_KEY_HERE

carriers.default-carrier=Colissimo
carriers.enable-api-integration=false

carriers.tracking-urls.LaPoste=https://www.laposte.fr/outils/suivre-vos-envois?code={trackingNumber}
carriers.tracking-urls.Colissimo=https://www.laposte.fr/outils/suivre-vos-envois?code={trackingNumber}
carriers.tracking-urls.DHL=https://www.dhl.fr/fr/express/suivi.html?AWB={trackingNumber}
carriers.tracking-urls.FedEx=https://www.fedex.com/fedextrack/?trknbr={trackingNumber}
carriers.tracking-urls.UPS=https://www.ups.com/track?tracknum={trackingNumber}
carriers.tracking-urls.Chronopost=https://www.chronopost.fr/tracking?num={trackingNumber}
carriers.tracking-urls.GLS=https://gls-group.eu/track/{trackingNumber}
carriers.tracking-urls.TNT=https://www.tnt.fr/track?cons={trackingNumber}

carriers.carrier-websites.LaPoste=https://www.laposte.fr
carriers.carrier-websites.Colissimo=https://www.laposte.fr/particulier
carriers.carrier-websites.DHL=https://www.dhl.fr
carriers.carrier-websites.FedEx=https://www.fedex.com/fr-fr
carriers.carrier-websites.UPS=https://www.ups.com/fr
carriers.carrier-websites.Chronopost=https://www.chronopost.fr
carriers.carrier-websites.GLS=https://gls-group.eu/fr
carriers.carrier-websites.TNT=https://www.tnt.fr